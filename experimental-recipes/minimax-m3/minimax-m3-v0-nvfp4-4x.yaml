recipe_version: "2"
model: sparkarena/Minimax-M3-v0-NVFP4
runtime: sglang
container: scitrera/dgx-spark-sglang-mm:v0
min_nodes: 4
max_nodes: 4

metadata:
  description: Release recipe for Minimax M3 v0 NVFP4 on GB10/DGX Spark (NVFP4, CUDA graph bs<=16, InstantTensor, shared expert fusion enabled)
  quantization: nvfp4

executor_config:
  user: root

# Overlay the patched minimax-m3 tool-call parser before launching sglang.
# The patch streams nested tool-call params incrementally instead of buffering
# the whole body until the closing tag — fixes the multi-minute "blank question
# tool" stall in OpenCode and similar clients. See ./patches/ for source,
# tests, and the unified diff vs the in-image files.
#
# The patched files are staged on each node at
#   ~/.cache/huggingface/sparkrun-patches/minimax-m3/_llm_nom/
# (mounted into the container at /cache/huggingface/...) and copied into
# dist-packages here, after the container starts and before serve runs.
pre_exec:
  - >-
    bash -c '
    set -e;
    SRC=/cache/huggingface/sparkrun-patches/minimax-m3/_llm_nom;
    DST=/usr/local/lib/python3.12/dist-packages/sglang/srt/function_call/_llm_nom;
    cp -v "$SRC"/m3_text.py "$SRC"/generator.py "$DST"/;
    python3 -c "from sglang.srt.function_call._llm_nom.m3_text import M3TextParser; assert hasattr(M3TextParser, \"_stream_nested_parameter\"); print(\"[pre_exec] m3 streaming patch applied\")";
    '

defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 4
  gpu_memory_utilization: 0.80
  max_model_len: 200000
  max_num_batched_tokens: 8192
  kv_cache_dtype: auto
  reasoning_parser: minimax-m3
  tool_call_parser: minimax-m3
  moe_runner_backend: triton
  fp4_gemm_backend: cutlass
  load_format: instanttensor
  cuda_graph_max_bs: 16
  cuda_graph_bs: "1 2 4 8 12 16"

env:
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"

command: |
  sglang serve \
    --model-path {model} \
    --mem-fraction-static {gpu_memory_utilization} \
    --context-length {max_model_len} \
    --tp-size {tensor_parallel} \
    --chunked-prefill-size {max_num_batched_tokens} \
    --fp4-gemm-backend {fp4_gemm_backend} \
    --load-format {load_format} \
    --kv-cache-dtype {kv_cache_dtype} \
    --reasoning-parser {reasoning_parser} \
    --tool-call-parser {tool_call_parser} \
    --moe-runner-backend {moe_runner_backend} \
    --trust-remote-code \
    --enable-metrics \
    --cuda-graph-max-bs {cuda_graph_max_bs} \
    --cuda-graph-bs {cuda_graph_bs} \
    --host {host} \
    --port {port}
